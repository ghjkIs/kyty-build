name: Build KytyPS5 descriptor fix V4 (V3 + PR 1224, Layer A) for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out the exact official revision
        uses: actions/checkout@v4
        with:
          repository: KytyPS5/KytyPS5
          ref: 7b9997baea0d385e9e8fc2bd3abeb02110bc4148
          path: source
          submodules: recursive
          persist-credentials: false

      - name: Check out the V4 kit (this branch) for the patch
        uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false

      - name: Verify and apply the experimental V4 patch
        shell: python
        run: |
          import hashlib, pathlib, shutil, subprocess
          # Cumulative patch vs 7b9997b: V2 + V3 + port of KytyPS5 PR #1224. Pinned by SHA256.
          expected = "68c673346c67a1ab1bee46b4db89f0f663b1fccf571aadbc5a2735e4c253f4f2"
          source = pathlib.Path("kit/descriptor-fix-v4/descriptor-v4.patch")
          # Windows runners may check text out with CRLF (core.autocrlf); the pinned patch is LF-only.
          patch = source.read_bytes().replace(b"\r\n", b"\n")
          assert hashlib.sha256(patch).hexdigest() == expected, "Patch checksum mismatch"
          path = pathlib.Path("descriptor-v4.patch").resolve()
          path.write_bytes(patch)
          subprocess.run(["git", "-C", "source", "apply", "--check", str(path)], check=True)
          subprocess.run(["git", "-C", "source", "apply", str(path)], check=True)
          subprocess.run(["git", "-C", "source", "diff", "--check"], check=True)

      - name: Set up Visual Studio x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install glslang
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Split-Path (Get-Command vcpkg -ErrorAction Stop).Source
          & vcpkg install 'glslang[tools,opt]:x64-windows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure the patched source
        shell: cmd
        run: >-
          cmake -S source -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
          -DKYTY_BUILD_ORIGIN=Source

      - name: Compile the launcher, emulator, and regression tests
        shell: cmd
        run: cmake --build build --target launcher kyty_emulator resource_tracking_tests --parallel 4

      - name: Run resource-tracking regression tests
        shell: cmd
        run: ctest --test-dir build -R "^resource_tracking$" --output-on-failure

      - name: Stage a runnable Windows installation
        shell: cmd
        run: cmake --install build --prefix install

      - name: Verify executables and attach provenance
        shell: python
        run: |
          import pathlib, shutil, subprocess, zipfile
          install = pathlib.Path("install")
          for filename in ("launcher.exe", "kyty_emulator.exe"):
              assert (install / filename).is_file(), f"Missing {filename}"
          shutil.copy2("descriptor-v4.patch", install / "descriptor-v4.patch")
          shutil.copy2("source/LICENSE", install / "LICENSE")
          shutil.copytree("source/LICENSES", install / "LICENSES", dirs_exist_ok=True)
          (install / "BUILD-INFO.txt").write_text(
              "KytyPS5 descriptor fix V4 (Layer A) - EXPERIMENTAL.\n"
              "V4 = V3 + port of KytyPS5 PR #1224 (TheCruZ) descriptor Phi handling.\n"
              "Includes V2 (indirect buffer reads, terminal StoreBufferU32 descriptor Phi) and\n"
              "V3 (host Select lowering for multi-use uniform descriptor Phis used by BufferAtomic*,\n"
              "e.g. Ace Combat 8 PPSA24913 CS 0x1d81bb2b74faf456, 4x BufferAtomicOr32).\n"
              "V4 adds: with shader writes, a uniform descriptor Phi is also host-lowered when its branch\n"
              "condition reads no memory (#1224), and any simple uniform expression over the Phi\n"
              "(Phi|imm, (Phi+imm)|imm, Phi<<k, ...) is rebuilt over the host selection. LaneId-dependent\n"
              "selection and diamonds inside loops are still rejected.\n"
              "NOT included: Jetsku software RT, Layer B BDA writes, skip-instead-of-exit.\n"
              "Ace Combat 8 and Astro Bot compatibility are UNVERIFIED; no game/GPU run was performed.\n"
              "Upstream: https://github.com/KytyPS5/KytyPS5\n"
              "Base: 7b9997baea0d385e9e8fc2bd3abeb02110bc4148\n"
              "Patch SHA256: 68c673346c67a1ab1bee46b4db89f0f663b1fccf571aadbc5a2735e4c253f4f2\n"
              "Resource-tracking tests passed in this build.\n", encoding="utf-8")
          (install / "Run-PPSA24913-Diagnostic.cmd").write_bytes(b'@echo off\r\nsetlocal\r\ncd /d "%~dp0"\r\nset "GAME=F:\\Games\\PS5 Emulator and Games\\PPSA24913-app0"\r\nif not exist "kyty_emulator.exe" (\r\n  echo Copy this file next to kyty_emulator.exe first.\r\n  pause\r\n  exit /b 1\r\n)\r\nif not exist "%GAME%\\eboot.bin" (\r\n  echo Game not found at "%GAME%". Edit the GAME line in this file.\r\n  pause\r\n  exit /b 1\r\n)\r\nkyty_emulator.exe --game "%GAME%" --graphics-debug-dump true --shader-log-direction File --shader-log-folder "_Shaders-V4" --printf-direction File --printf-output-file "ace-combat-detail-v4.txt" > "ace-combat-log-v4.txt" 2>&1\r\necho Emulator exited. Logs are saved beside this script.\r\npause\r\n')
          # Include the modified tracked source and the pinned submodule list for review.
          entries = subprocess.check_output(["git", "-C", "source", "ls-files", "--stage", "-z"]).decode().split("\0")
          with zipfile.ZipFile("patched-source.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for entry in entries:
                  if not entry:
                      continue
                  meta, name = entry.split("\t", 1)
                  if meta.startswith("160000 "):
                      continue
                  archive.write(pathlib.Path("source") / name, name)
              refs = subprocess.check_output(["git", "-C", "source", "submodule", "status", "--recursive"])
              archive.writestr("PINNED-SUBMODULES.txt", refs)
              archive.write("descriptor-v4.patch", "descriptor-v4.patch")

      - name: Downloadable Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Descriptor-Fix-V4-Windows-x64
          path: install/
          if-no-files-found: error
          retention-days: 14

      - name: Downloadable modified source
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Descriptor-Fix-V4-Source
          path: patched-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Test diagnostics if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-V4-Build-Diagnostics
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
