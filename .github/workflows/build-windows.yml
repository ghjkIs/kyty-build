              archive.write("v11-on-v10.patch", "v11-on-v10.patch")
              archive.write("v12-on-v11.patch", "v12-on-v11.patch")
              archive.write("v13-on-v12.patch", "v13-on-v12.patch")
              archive.write("v14-on-v13.patch", "v14-on-v13.patch")
              archive.write("v15-on-v14.patch", "v15-on-v14.patch")
              archive.write("descriptor-v15-cumulative.patch", "descriptor-v15-cumulative.patch")
              archive.write("patch-shas.txt", "patch-shas.txt")

      - name: Downloadable Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Descriptor-Fix-V15-Windows-x64
          path: install/
          if-no-files-found: error
          retention-days: 14

      - name: Downloadable modified source
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Descriptor-Fix-V15-Source
          path: patched-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Test diagnostics if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Descriptor-Fix-V15-Diagnostics
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14

      - name: Optional shader CFG regression tests (non-blocking)
        if: success()
        continue-on-error: true
        shell: cmd
        run: cmake --build build --target shader_cfg_tests --parallel 4 && ctest --test-dir build -R "^shader_cfg$" --output-on-failure
