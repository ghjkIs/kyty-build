      - name: Set up Visual Studio x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install glslang
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Split-Path (Get-Command vcpkg -ErrorAction Stop).Source
          & vcpkg install 'glslang[tools,opt]:x64-windows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure the patched source
        shell: cmd
        run: >-
          cmake -S source -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
          -DKYTY_BUILD_ORIGIN=Source

      - name: Compile the launcher, emulator, and regression tests
        shell: cmd
        run: cmake --build build --target launcher kyty_emulator resource_tracking_tests --parallel 4

      - name: Run resource-tracking regression tests
        shell: cmd
        run: ctest --test-dir build -R "^resource_tracking$" --output-on-failure

      - name: Stage a runnable Windows installation
        shell: cmd
        run: cmake --install build --prefix install

      - name: Verify executables and attach provenance
        shell: python
        run: |
          import pathlib, shutil, subprocess, zipfile
          install = pathlib.Path("install")
          for filename in ("launcher.exe", "kyty_emulator.exe"):
              assert (install / filename).is_file(), f"Missing {filename}"
          shutil.copy2("descriptor-v3.patch", install / "descriptor-v3.patch")
          shutil.copy2("source/LICENSE", install / "LICENSE")
          shutil.copytree("source/LICENSES", install / "LICENSES", dirs_exist_ok=True)
          (install / "BUILD-INFO.txt").write_text(
              "KytyPS5 descriptor fix V3 - EXPERIMENTAL.\n"
              "Includes V2 (indirect buffer reads, terminal StoreBufferU32 descriptor Phi).\n"
              "V3 adds host-side Select lowering for multi-use uniform descriptor Phis used by BufferAtomic*\n"
              "(e.g. Ace Combat 8 PPSA24913 CS 0x1d81bb2b74faf456, 4x BufferAtomicOr32).\n"
              "Ace Combat 8 compatibility is UNVERIFIED; no game/GPU run was performed when preparing this patch.\n"
              "Upstream: https://github.com/KytyPS5/KytyPS5\n"
              "Base: 7b9997baea0d385e9e8fc2bd3abeb02110bc4148\n"
              "Patch SHA256: bbc01f37ce41f4a7c7f1e811ba769a987375402406d3aa07cbaae5d62f45e4bf\n"
              "Resource-tracking tests passed in this build.\n", encoding="utf-8")
          (install / "Run-PPSA24913-Diagnostic.cmd").write_bytes(b'@echo off\r\nsetlocal\r\ncd /d "%~dp0"\r\nset "GAME=F:\\Games\\PS5 Emulator and Games\\PPSA24913-app0"\r\nif not exist "kyty_emulator.exe" (\r\n  echo Copy this file next to kyty_emulator.exe first.\r\n  pause\r\n  exit /b 1\r\n)\r\nif not exist "%GAME%\\eboot.bin" (\r\n  echo Game not found at "%GAME%". Edit the GAME line in this file.\r\n  pause\r\n  exit /b 1\r\n)\r\nkyty_emulator.exe --game "%GAME%" --graphics-debug-dump true --shader-log-direction File --shader-log-folder "_Shaders-V3" --printf-direction File --printf-output-file "ace-combat-detail-v3.txt" > "ace-combat-log-v3.txt" 2>&1\r\necho Emulator exited. Logs are saved beside this script.\r\npause\r\n')
          # Include the modified tracked source and the pinned submodule list for review.
          entries = subprocess.check_output(["git", "-C", "source", "ls-files", "--stage", "-z"]).decode().split("\0")
          with zipfile.ZipFile("patched-source.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for entry in entries:
                  if not entry:
                      continue
                  meta, name = entry.split("\t", 1)
                  if meta.startswith("160000 "):
                      continue
                  archive.write(pathlib.Path("source") / name, name)
              refs = subprocess.check_output(["git", "-C", "source", "submodule", "status", "--recursive"])
              archive.writestr("PINNED-SUBMODULES.txt", refs)
              archive.write("descriptor-v3.patch", "descriptor-v3.patch")

      - name: Downloadable Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Descriptor-Fix-V3-Windows-x64
          path: install/
          if-no-files-found: error
          retention-days: 14

      - name: Downloadable modified source
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Descriptor-Fix-V3-Source
          path: patched-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Test diagnostics if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-V3-Build-Diagnostics
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
